<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do List - Connexion</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">To Do List : LA solution qui vous fait gagner du temps !</div>
    </header>
    <div class="container">
        <div class="illustrationimage">
            <img src="assets/officeillustration.jpg" alt="illustration of office"/>    
        </div>
        <div class="form-card">
            <form id="login-form">
                <label for="name">Entrez votre prénom :</label>
                <input id="name" type="text">
                <p id="errorName"></p>
                <button id="submitName" type="submit">Voir la liste des tâches</button>
            </form>
        </div>
    </div>
    <p id="appDescription">To Do List est une solution qui vous permet de créer, gérer et suivre les tâches de tous vos collaborateurs.</p>
    <footer>© 2026 EM Services</footer>
    <script src="index.js"></script>
</body>
</html>
