<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do List - Ajouter une tâche</title>
  <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>
        <div class="logo">To Do List</div>
        <h1 id="messageBienvenue"></h1>
    </header>

<h2 id="taskTitle">Ajouter une tâche</h2>
<p id="error"></p>
<form id="addTaskForm">
    <label for="taskName">Nom de la tâche :</label>
    <input type="text" id="taskName" name="taskName" required>
    <label for="addTaskTags">Tags :</label>
    <textarea id="addTaskTags" name="addTaskTags" placeholder="Séparez les tags par des virgules"></textarea>
    <button type="submit">Ajouter</button>
</form>

<script src="addTask.js"></script>

</body>
