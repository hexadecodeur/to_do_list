<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do List - Détails des tâches</title>
  <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>
        <div class="logo">To Do List</div>
        <h1 id="messageBienvenue"></h1>
    </header>

<h2 id="taskDetails">Détails de la tâche</h2>
<h3 id="taskName"></h3>
<p id="taskTags"></p>
<p id="taskStatus"></p>
<p id="taskDate"></p>
<p id="error"></p>
<button id="finishedButton">Définir comme terminée</button>
<button id="unfinishedButton">Définir comme "à faire"</button>
<button id="deleteButton">Supprimer la tâche</button>
<script src="taskDetails.js"></script>
</body>
</html>
